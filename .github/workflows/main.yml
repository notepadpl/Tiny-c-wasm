name: Build Wasm and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Uruchamia się po każdym pushu na gałąź main
  workflow_dispatch: # Pozwala uruchomić ręcznie z zakładki Actions

# Uprawnienia wymagane do publikacji na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapobiega nakładaniu się jednoczesnych wdrożeń
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Kompilacja tiny_wasm.c do WebAssembly
        run: |
          mkdir -p dist
          cp index.html dist/
          emcc tinywasm.c -o dist/tiny_wasm.js \
            -s EXPORTED_FUNCTIONS='["_parse_http_request", "_malloc", "_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["stringToUTF8", "UTF8ToString", "lengthBytesUTF8", "getValue"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -O2

      - name: Przygotowanie artefaktu dla GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
