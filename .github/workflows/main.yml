name: Build Wasm and Push to gh-pages branch

on:
  push:
    branches:
      - main # Uruchamia się po każdym pushu na gałąź main
  workflow_dispatch: # Pozwala uruchomić ręcznie z zakładki Actions

# Wymagane uprawnienie zapisu, aby utworzyć i zaktualizować gałąź gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Kompilacja tiny_wasm.c do WebAssembly
        run: |
          mkdir -p dist
          cp index.html dist/
          emcc tinywasm.c -o dist/tiny_wasm.js \
            -s EXPORTED_FUNCTIONS='["_parse_http_request", "_malloc", "_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["stringToUTF8", "UTF8ToString", "lengthBytesUTF8", "getValue"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -O2

      - name: Utworzenie i wypchnięcie zawartości dist/ na gałąź gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true # Tworzy czystą gałąź bez historii poprzednich buildów (oszczędza miejsce)
